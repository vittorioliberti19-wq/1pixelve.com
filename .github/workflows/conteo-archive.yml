name: Respaldo conteo (semanal)

# Vuelca los snapshots diarios del Worker (KV) a JSON versionado en el repo.
# Corre en la nube de GitHub — no depende de ninguna Mac prendida.
on:
  schedule:
    - cron: "0 9 * * 1" # Lunes 09:00 UTC = 05:00 Caracas
  workflow_dispatch: {} # botón manual en la pestaña Actions

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exportar snapshots a JSON
        env:
          CONTEO_SECRET: ${{ secrets.CONTEO_SECRET }}
        run: bash conteo/archive/refresh-archive.sh

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add conteo/archive/*.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el archivo."
          else
            git commit -m "chore(conteo): respaldo semanal $(date +%F)"
            git push
          fi
